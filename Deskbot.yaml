            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x080818
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

            widgets:

              # ── LEFT EYE ────────────────────────────────
              - obj:
                  id: left_eye_socket
                  x: 95
                  y: 155
