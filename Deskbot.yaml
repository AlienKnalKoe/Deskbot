              # ── CHEEKS ────────────────────────────────────
              - obj:
                  id: left_cheek
                  x: 55
                  y: 298
                  width: 75
                  height: 28
                  radius: 14
                  bg_color: 0x550022
                  bg_opa: 30%
                  border_width: 0

              - obj:
                  id: right_cheek
                  x: 350
                  y: 298
                  width: 75
                  height: 28
                  radius: 14
                  bg_color: 0x550022
                  bg_opa: 30%
                  border_width: 0

              # ── NOTIFICATION BAR ──────────────────────────
              - label:
