                  width: 130
                  height: 50
                  bg_color: 0x221111
                  border_color: 0x882222
                  border_width: 2
                  radius: 10
                  shadow_opa: transp
                  on_click:
                    - button.press: restart_button
                  widgets:
                    - label:
                        text: "↺ Restart"
                        align: CENTER
                        text_color: 0xff6666
                        text_font: font_small

              # Back to face
              - button:
                  x: 290
                  y: 410
                  width: 160
                  height: 50
                  bg_color: 0x1a1a3a
                  border_opa: transp
                  shadow_opa: transp
                  on_click:
                    - lvgl.page.show: face_page
                  widgets:
                    - label:
                        text: "← Back"
                        align: CENTER
                        text_color: 0x8888ff
                        text_font: font_small

##############################################################
# RESTART BUTTON
##############################################################

button:
  - platform: restart
    id: restart_button
    name: "Restart"

##############################################################
# SCRIPTS
##############################################################

script:

  # ── Idle blink loop ──────────────────────────────────────
  - id: face_idle_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - delay: !lambda "return 3000 + (rand() % 4000);"
            - script.execute: do_blink
            - if:
                condition:
                  lambda: "return (rand() % 4) == 0;"
                then:
                  - delay: 180ms
                  - script.execute: do_blink

  # ── Single blink ─────────────────────────────────────────
  - id: do_blink
    mode: single
    then:
      - lvgl.widget.update:
          id: left_eyelid
          height: 130
      - lvgl.widget.update:
          id: right_eyelid
          height: 130
      - delay: 110ms
      - lvgl.widget.update:
          id: left_eyelid
          height: 0
      - lvgl.widget.update:
          id: right_eyelid
          height: 0

  # ── Pupil wander loop ────────────────────────────────────
  # Pupils drift to a random offset from home every 2-5s
  - id: pupil_wander_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - delay: !lambda "return 2000 + (rand() % 3000);"
            - lambda: |-
                // Random offset -12 to +12 pixels from home
                int ox = (rand() % 25) - 12;
                int oy = (rand() % 25) - 12;
                int lx = id(pupil_home_lx) + ox;
                int ly = id(pupil_home_ly) + oy;
                int rx = id(pupil_home_rx) + ox;  // both eyes look same direction
                int ry = id(pupil_home_ry) + oy;
                // Shine follows pupil
                lv_obj_set_pos(id(left_pupil), lx, ly);
                lv_obj_set_pos(id(left_shine), lx + 8, ly + 5);
                lv_obj_set_pos(id(right_pupil), rx, ry);
                lv_obj_set_pos(id(right_shine), rx + 8, ry + 5);
            - delay: 800ms
            # Return to center
            - lambda: |-
                lv_obj_set_pos(id(left_pupil), id(pupil_home_lx), id(pupil_home_ly));
                lv_obj_set_pos(id(left_shine), id(pupil_home_lx) + 8, id(pupil_home_ly) + 5);
                lv_obj_set_pos(id(right_pupil), id(pupil_home_rx), id(pupil_home_ry));
                lv_obj_set_pos(id(right_shine), id(pupil_home_rx) + 8, id(pupil_home_ry) + 5);

  # ── Touch flash ──────────────────────────────────────────
  - id: face_react_to_touch
    mode: restart
    then:
      - lvgl.widget.update:
          id: left_iris
          bg_color: 0x00bbff
      - lvgl.widget.update:
          id: right_iris
          bg_color: 0x00bbff
      - delay: 500ms
      - lvgl.widget.update:
          id: left_iris
          bg_color: 0x0055ee
      - lvgl.widget.update:
          id: right_iris
          bg_color: 0x0055ee

  # ── Happy burst ──────────────────────────────────────────
  - id: face_happy_burst
    mode: restart
    then:
      - globals.set:
          id: mood_state
          value: "1"
      - lvgl.widget.update:
          id: left_iris
          bg_color: 0x00ffcc
          width: 90
          height: 90
          x: 115
          y: 175
      - lvgl.widget.update:
          id: right_iris
          bg_color: 0x00ffcc
          width: 90
          height: 90
          x: 275
          y: 175
      - lvgl.widget.update:
          id: left_cheek
          bg_color: 0xdd2255
          bg_opa: 70%
      - lvgl.widget.update:
          id: right_cheek
          bg_color: 0xdd2255
          bg_opa: 70%
      - lvgl.widget.update:
          id: mouth_neutral
          hidden: true
      - lvgl.widget.update:
          id: mouth_happy
          hidden: false
      - delay: 400ms
      - script.execute: do_blink
      - delay: 280ms
      - script.execute: do_blink
      - delay: 1500ms
      - script.execute: face_reset_idle

  # ── Alert / notification ─────────────────────────────────
  - id: face_show_notification
    mode: restart
    then:
      - lvgl.page.show: face_page
      - lvgl.widget.update:
          id: left_iris
          bg_color: 0xff6600
      - lvgl.widget.update:
          id: right_iris
          bg_color: 0xff6600
      - lvgl.widget.update:
          id: mouth_neutral
          hidden: true
      - lvgl.widget.update:
          id: mouth_alert
          hidden: false
      - lvgl.label.update:
          id: notif_label
          text: !lambda "return id(notif_text).c_str();"
      - delay: 8s
      - lvgl.label.update:
          id: notif_label
          text: ""
      - globals.set:
          id: mood_state
          value: "0"
      - script.execute: face_reset_idle

  # ── Reset to idle ────────────────────────────────────────
  - id: face_reset_idle
    mode: single
    then:
      - lvgl.widget.update:
          id: left_iris
          bg_color: 0x0055ee
          width: 80
          height: 80
          x: 120
          y: 180
      - lvgl.widget.update:
          id: right_iris
          bg_color: 0x0055ee
          width: 80
          height: 80
          x: 280
          y: 180
      - lvgl.widget.update:
          id: left_cheek
          bg_color: 0x550022
          bg_opa: 30%
      - lvgl.widget.update:
          id: right_cheek
          bg_color: 0x550022
          bg_opa: 30%
      - lvgl.widget.update:
          id: mouth_neutral
          hidden: false
      - lvgl.widget.update:
          id: mouth_happy
          hidden: true
      - lvgl.widget.update:
          id: mouth_alert
          hidden: true
      - globals.set:
          id: mood_state
          value: "0"

  # ── Face styles ──────────────────────────────────────────
  # Female — softer pink/purple iris, rounder eyes
  - id: face_set_female
    mode: single
    then:
      - lvgl.widget.update:
          id: left_iris
          bg_color: 0xcc44aa
      - lvgl.widget.update:
          id: right_iris
          bg_color: 0xcc44aa
      - lvgl.widget.update:
          id: left_eye_socket
          border_color: 0x993388
      - lvgl.widget.update:
          id: right_eye_socket
          border_color: 0x993388
      - lvgl.widget.update:
          id: mouth_neutral
          bg_color: 0xff6699

  # Male — deeper blue, sharper
  - id: face_set_male
    mode: single
    then:
      - lvgl.widget.update:
          id: left_iris
          bg_color: 0x1144cc
      - lvgl.widget.update:
          id: right_iris
          bg_color: 0x1144cc
      - lvgl.widget.update:
          id: left_eye_socket
          border_color: 0x224488
      - lvgl.widget.update:
          id: right_eye_socket
          border_color: 0x224488
      - lvgl.widget.update:
          id: mouth_neutral
          bg_color: 0x3355cc

  # Robot — cyan/green, techy
  - id: face_set_robot
    mode: single
    then:
      - lvgl.widget.update:
          id: left_iris
          bg_color: 0x00ff88
      - lvgl.widget.update:
          id: right_iris
          bg_color: 0x00ff88
      - lvgl.widget.update:
          id: left_eye_socket
          border_color: 0x00aa55
      - lvgl.widget.update:
          id: right_eye_socket
          border_color: 0x00aa55
      - lvgl.widget.update:
          id: mouth_neutral
          bg_color: 0x00cc66

##############################################################
# TIME UPDATE — refresh clock label every minute
##############################################################

interval:
  - interval: 60s
    then:
      - lvgl.label.update:
          id: info_time_label
          text: !lambda |-
            return id(sntp_time).now().strftime("%H:%M").c_str();
      - lvgl.label.update:
          id: info_date_label
          text: !lambda |-
            return id(sntp_time).now().strftime("%A, %d %B").c_str();

##############################################################
# RELAYS
##############################################################

switch:
  - platform: gpio
    name: "Relay 1"
    pin:
      number: GPIO40
      inverted: true
  - platform: gpio
    name: "Relay 2"
    pin:
      number: GPIO2
      inverted: true

##############################################################
# END
##############################################################
