                    - script.execute: face_happy_burst

    ##########################################################
    # PAGE 2 — INFO (time, weather, HA sensors)
    ##########################################################
    - id: info_page
      bg_color: 0x080818
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x080818
            border_width: 0
            radius: 0
