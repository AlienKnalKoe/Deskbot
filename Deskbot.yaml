##############################################################
# DESKBOT — ESP32-4848S040 (Guition)
# ESPHome 2025.9.0+  |  mipi_rgb  |  LVGL  |  GT911
#
# Pages:
#   face_page    — animated face, idle/happy/alert/notify
#   info_page    — time, weather, HA sensors
#   control_page — light/scene buttons
#   settings_page— wifi status, HA status, brightness, face gender
##############################################################

substitutions:
  device_name: deskbot
  friendly_name: Deskbot
  timezone: "Europe/Amsterdam"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: face_idle_loop
      - script.execute: pupil_wander_loop

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_FREERTOS_HZ: "1000"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: "deskbot123"

time:
  - platform: sntp
    id: sntp_time
    timezone: "${timezone}"
    on_time_sync:
      - lvgl.label.update:
          id: info_time_label
          text: !lambda |-
            return id(sntp_time).now().strftime("%H:%M").c_str();

##############################################################
# FONT
##############################################################

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 20
  - file: "gfonts://Roboto"
    id: font_medium
    size: 28
  - file: "gfonts://Roboto"
    id: font_large
    size: 52
    glyphs: "0123456789: "

##############################################################
# BACKLIGHT
##############################################################

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 12000Hz
    min_power: 0.08

light:
  - platform: monochromatic
    name: "Backlight"
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

##############################################################
# SPI — software, needed for ST7701S init sequence
##############################################################

spi:
  - id: display_init_spi
    interface: software
    clk_pin: GPIO48
    mosi_pin: GPIO47
    miso_pin: GPIO41

##############################################################
# I2C — GT911 touch (GPIO45 is strapping pin, needs warning suppressed)
##############################################################

i2c:
  id: i2c_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  frequency: 400kHz

##############################################################
# DISPLAY
##############################################################

display:
  - platform: mipi_rgb
    id: main_display
    model: GUITION-4848S040
    spi_id: display_init_spi
    update_interval: never
    auto_clear_enabled: false
    rotation: 270   # corrects the 90° clockwise tilt

##############################################################
# TOUCHSCREEN
##############################################################

touchscreen:
  - platform: gt911
    id: touch
    display: main_display
    i2c_id: i2c_bus
    address: 0x5D
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      then:
        - script.execute: face_react_to_touch

##############################################################
# GLOBALS
##############################################################

globals:
  - id: mood_state
    type: int
    restore_value: no
    initial_value: "0"
  - id: notif_text
    type: std::string
    restore_value: no
    initial_value: '""'
  # Pupil home positions (center of iris)
  - id: pupil_home_lx
    type: int
    restore_value: no
    initial_value: "149"
  - id: pupil_home_ly
    type: int
    restore_value: no
    initial_value: "209"
  - id: pupil_home_rx
    type: int
    restore_value: no
    initial_value: "309"
  - id: pupil_home_ry
    type: int
    restore_value: no
    initial_value: "209"

##############################################################
# HOME ASSISTANT — incoming data
##############################################################

text_sensor:
  # Push a notification: write to input_text.deskbot_notification in HA
  - platform: homeassistant
    id: ha_notification
    entity_id: input_text.deskbot_notification
    on_value:
      then:
        - globals.set:
            id: notif_text
            value: !lambda "return x;"
        - script.execute: face_show_notification

  # Weather condition from HA weather entity
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.home
    on_value:
      then:
        - lvgl.label.update:
            id: info_weather_label
            text: !lambda "return x.c_str();"

sensor:
  # Outside temperature
  - platform: homeassistant
    id: ha_temperature
    entity_id: weather.home
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: info_temp_label
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f°C", x);
              return std::string(buf);

  # HA mood override (input_number 0-4)
  - platform: homeassistant
    id: ha_mood
    entity_id: input_number.deskbot_mood
    on_value:
      then:
        - globals.set:
            id: mood_state
            value: !lambda "return (int)x;"

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 30s
    on_value:
      then:
        - lvgl.label.update:
            id: settings_wifi_label
            text: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "WiFi: %.0f dBm", x);
              return std::string(buf);

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: status
    name: "Status"
    id: ha_connection_status
    on_press:
      then:
        - lvgl.label.update:
            id: settings_ha_label
            text: "HA: Connected"
    on_release:
      then:
        - lvgl.label.update:
            id: settings_ha_label
            text: "HA: Offline"

##############################################################
# LVGL
##############################################################

lvgl:
  id: lvgl_component
  buffer_size: 40%
  color_depth: 16
  touchscreens:
    - touch

  pages:

    ##########################################################
    # PAGE 1 — FACE
    ##########################################################
    - id: face_page
      bg_color: 0x080818
      widgets:

        # ── ROOT CONTAINER ──────────────────────────────────
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x080818
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

            widgets:

              # ── LEFT EYE ──────────────────────────────────
              - obj:
                  id: left_eye_socket
                  x: 95
                  y: 155
                  width: 130
                  height: 130
                  radius: 65
                  bg_color: 0x0a0a1e
                  border_width: 3
                  border_color: 0x2233aa
                  pad_all: 0

              - obj:
                  id: left_iris
                  x: 120
                  y: 180
                  width: 80
                  height: 80
                  radius: 40
                  bg_color: 0x0055ee
                  border_width: 0

              - obj:
                  id: left_pupil
                  x: 149
                  y: 209
                  width: 22
                  height: 22
                  radius: 11
                  bg_color: 0x000000
                  border_width: 0

              - obj:
                  id: left_shine
                  x: 157
                  y: 214
                  width: 7
                  height: 7
                  radius: 4
                  bg_color: 0xffffff
                  border_width: 0

              # Eyelid — height 0=open, 130=closed
              - obj:
                  id: left_eyelid
                  x: 95
                  y: 155
                  width: 130
                  height: 0
                  radius: 65
                  bg_color: 0x080818
                  border_width: 0

              # ── RIGHT EYE ─────────────────────────────────
              - obj:
                  id: right_eye_socket
                  x: 255
                  y: 155
                  width: 130
                  height: 130
                  radius: 65
                  bg_color: 0x0a0a1e
                  border_width: 3
                  border_color: 0x2233aa
                  pad_all: 0

              - obj:
                  id: right_iris
                  x: 280
                  y: 180
                  width: 80
                  height: 80
                  radius: 40
                  bg_color: 0x0055ee
                  border_width: 0

              - obj:
                  id: right_pupil
                  x: 309
                  y: 209
                  width: 22
                  height: 22
                  radius: 11
                  bg_color: 0x000000
                  border_width: 0

              - obj:
                  id: right_shine
                  x: 317
                  y: 214
                  width: 7
                  height: 7
                  radius: 4
                  bg_color: 0xffffff
                  border_width: 0

              - obj:
                  id: right_eyelid
                  x: 255
                  y: 155
                  width: 130
                  height: 0
                  radius: 65
                  bg_color: 0x080818
                  border_width: 0

              # ── MOUTH ─────────────────────────────────────
              - obj:
                  id: mouth_neutral
                  x: 160
                  y: 340
                  width: 160
                  height: 10
                  radius: 5
                  bg_color: 0x3355cc
                  border_width: 0

              - obj:
                  id: mouth_happy
                  x: 150
                  y: 336
                  width: 180
                  height: 20
                  radius: 10
                  bg_color: 0x00ddaa
                  border_width: 0
