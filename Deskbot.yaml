##############################################################
# DESKBOT — ESP32-4848S040 (Guition)
# ESPHome 2025.9.0+  |  mipi_rgb  |  LVGL  |  GT911
#
# Rotation fix: display has NO rotation (matching Eve).
#   The face is drawn correctly for however your screen sits.
#   If it appears rotated, flip physical mounting — don't
#   rotate in software or touch coords break.
#
# Icons: MDI webfont — NO emoji (causes squares).
#   Download materialdesignicons-webfont.ttf and place it in
#   a fonts/ folder next to your yaml BEFORE compiling.
#   https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
#
# Pages: face / info / controls / settings
##############################################################

substitutions:
  device_name: deskbot
  friendly_name: Deskbot
  timezone: "Europe/Amsterdam"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: face_idle_loop
      - script.execute: pupil_wander_loop

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_FREERTOS_HZ: "1000"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: "deskbot123"

time:
  - platform: sntp
    id: sntp_time
    timezone: "${timezone}"
    on_time_sync:
      - lvgl.label.update:
          id: info_time_label
          text: !lambda "return id(sntp_time).now().strftime(\"%H:%M\").c_str();"
      - lvgl.label.update:
          id: info_date_label
          text: !lambda "return id(sntp_time).now().strftime(\"%A, %d %B\").c_str();"

##############################################################
# FONTS
# - Roboto for all text (explicit glyphs list = no squares)
# - MDI webfont for icons (codepoints listed in comments)
##############################################################

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 20
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,:-+%/()!?'< "

  - file: "gfonts://Roboto"
    id: font_medium
    size: 28
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,:-+%/()!?'"

  - file: "gfonts://Roboto"
    id: font_large
    size: 60
    glyphs: "0123456789: "

  # MDI icons — \U000FXXXX codepoints
  # lightbulb=F0335  movie=F0438  sunny=F059D  night=F0594
  # power=F0493  info=F0210  cog=F0533  arrow-left=F0004
  # female=F0156  male=F0157  robot=F066F  reload=F0450
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_icons
    size: 28
    glyphs:
      - "\U000F0335"
      - "\U000F0438"
      - "\U000F059D"
      - "\U000F0594"
      - "\U000F0493"
      - "\U000F0210"
      - "\U000F0533"
      - "\U000F0004"
      - "\U000F0156"
      - "\U000F0157"
      - "\U000F066F"
      - "\U000F0450"

##############################################################
# BACKLIGHT
##############################################################

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 12000Hz
    min_power: 0.08

light:
  - platform: monochromatic
    name: "Backlight"
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

##############################################################
# SPI — software interface, needed for ST7701S init sequence
##############################################################

spi:
  - id: display_init_spi
    interface: software
    clk_pin: GPIO48
    mosi_pin: GPIO47
    miso_pin: GPIO41

##############################################################
# I2C — GT911 touch
##############################################################

i2c:
  id: i2c_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  frequency: 400kHz

##############################################################
# DISPLAY — no rotation, matches working Eve config
##############################################################

display:
  - platform: mipi_rgb
    id: main_display
    model: GUITION-4848S040
    spi_id: display_init_spi
    update_interval: never
    auto_clear_enabled: false

##############################################################
# TOUCHSCREEN
##############################################################

touchscreen:
  - platform: gt911
    id: touch
    display: main_display
    i2c_id: i2c_bus
    address: 0x5D
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      then:
        - script.execute: face_react_to_touch

##############################################################
# GLOBALS
##############################################################

globals:
  - id: mood_state
    type: int
    restore_value: no
    initial_value: "0"

  - id: notif_text
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pupil_home_lx
    type: int
    restore_value: no
    initial_value: "149"
  - id: pupil_home_ly
    type: int
    restore_value: no
    initial_value: "209"
  - id: pupil_home_rx
    type: int
    restore_value: no
    initial_value: "309"
  - id: pupil_home_ry
    type: int
    restore_value: no
    initial_value: "209"

##############################################################
# HOME ASSISTANT
##############################################################

text_sensor:
  - platform: homeassistant
    id: ha_notification
    entity_id: input_text.deskbot_notification
    on_value:
      then:
        - globals.set:
            id: notif_text
            value: !lambda "return x;"
        - script.execute: face_show_notification

  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.home
    on_value:
      then:
        - lvgl.label.update:
            id: info_weather_label
            text: !lambda "return x.c_str();"

sensor:
  - platform: homeassistant
    id: ha_temperature
    entity_id: weather.home
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: info_temp_label
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f C", x);
              return std::string(buf);

  - platform: homeassistant
    id: ha_mood
    entity_id: input_number.deskbot_mood
    on_value:
      then:
        - globals.set:
            id: mood_state
            value: !lambda "return (int)x;"

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 30s
    on_value:
      then:
        - lvgl.label.update:
            id: settings_wifi_label
            text: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "WiFi:  %.0f dBm", x);
              return std::string(buf);

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: status
    name: "Status"
    id: ha_connection_status
    on_press:
      then:
        - lvgl.label.update:
            id: settings_ha_label
            text: "HA: Connected"
    on_release:
      then:
        - lvgl.label.update:
            id: settings_ha_label
            text: "HA: Offline"

##############################################################
# LVGL
##############################################################

lvgl:
  id: lvgl_component
  buffer_size: 40%
  color_depth: 16
  touchscreens:
    - touch

  pages:

    ############################################################
    # PAGE 1 — FACE
    ############################################################
