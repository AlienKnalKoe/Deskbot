lvgl:
  id: lvgl_component
  buffer_size: 40%
  color_depth: 16
  touchscreens:
    - gt911_touch

  pages:

    ############################################################
    # PAGE 1 — FACE
    ############################################################
    - id: face_page
      bg_color: 0x080818
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x080818
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

            widgets:

              # ── LEFT EYE ────────────────────────────────
              - obj:
                  id: left_eye_socket
                  x: 95
                  y: 155
                  width: 130
                  height: 130
                  radius: 65
                  bg_color: 0x0a0a1e
                  border_width: 3
                  border_color: 0x2233aa
                  pad_all: 0

              - obj:
                  id: left_iris
                  x: 120
                  y: 180
                  width: 80
                  height: 80
                  radius: 40
                  bg_color: 0x0055ee
                  border_width: 0

              - obj:
                  id: left_pupil
                  x: 149
                  y: 209
                  width: 22
                  height: 22
                  radius: 11
                  bg_color: 0x000000
                  border_width: 0

              - obj:
                  id: left_shine
                  x: 157
                  y: 214
                  width: 7
                  height: 7
                  radius: 4
                  bg_color: 0xffffff
                  border_width: 0

              - obj:
                  id: left_eyelid
                  x: 95
                  y: 155
                  width: 130
                  height: 0
                  radius: 65
                  bg_color: 0x080818
                  border_width: 0

              # ── RIGHT EYE ───────────────────────────────
              - obj:
                  id: right_eye_socket
                  x: 255
                  y: 155
                  width: 130
                  height: 130
                  radius: 65
                  bg_color: 0x0a0a1e
                  border_width: 3
                  border_color: 0x2233aa
                  pad_all: 0

              - obj:
                  id: right_iris
                  x: 280
                  y: 180
                  width: 80
                  height: 80
                  radius: 40
                  bg_color: 0x0055ee
                  border_width: 0

              - obj:
                  id: right_pupil
                  x: 309
                  y: 209
                  width: 22
                  height: 22
                  radius: 11
                  bg_color: 0x000000
                  border_width: 0

              - obj:
                  id: right_shine
                  x: 317
                  y: 214
                  width: 7
                  height: 7
                  radius: 4
                  bg_color: 0xffffff
                  border_width: 0

              - obj:
                  id: right_eyelid
                  x: 255
                  y: 155
                  width: 130
                  height: 0
                  radius: 65
                  bg_color: 0x080818
                  border_width: 0

              # ── MOUTH ───────────────────────────────────
              - obj:
                  id: mouth_neutral
                  x: 160
                  y: 340
                  width: 160
                  height: 10
                  radius: 5
                  bg_color: 0x3355cc
                  border_width: 0

              - obj:
                  id: mouth_happy
                  x: 150
                  y: 336
                  width: 180
                  height: 20
                  radius: 10
                  bg_color: 0x00ddaa
                  border_width: 0
                  hidden: true

              - obj:
                  id: mouth_alert
                  x: 190
                  y: 342
                  width: 100
                  height: 6
                  radius: 3
                  bg_color: 0xff4400
                  border_width: 0
                  hidden: true

              # ── CHEEKS ──────────────────────────────────
              - obj:
                  id: left_cheek
                  x: 55
                  y: 298
                  width: 75
                  height: 28
                  radius: 14
                  bg_color: 0x550022
                  bg_opa: 30%
                  border_width: 0

              - obj:
                  id: right_cheek
                  x: 350
                  y: 298
                  width: 75
                  height: 28
                  radius: 14
                  bg_color: 0x550022
                  bg_opa: 30%
                  border_width: 0

              # ── NOTIFICATION BAR ────────────────────────
              - label:
                  id: notif_label
                  x: 60
                  y: 445
                  width: 360
                  height: 30
                  text: ""
                  text_color: 0xffcc00
                  text_font: font_small
                  bg_opa: transp

              # ── NAV BAR ─────────────────────────────────
              # Info — bottom left
              - button:
                  id: btn_to_info
                  x: 0
                  y: 438
                  width: 55
                  height: 42
                  bg_color: 0x111128
                  border_opa: transp
                  shadow_opa: transp
                  radius: 8
                  on_click:
                    - lvgl.page.show: info_page
                  widgets:
                    - label:
                        text: "\U000F0210"
                        align: CENTER
                        text_font: font_icons
                        text_color: 0x6677cc

              # Controls — bottom right
              - button:
                  id: btn_to_controls
                  x: 425
                  y: 438
                  width: 55
                  height: 42
                  bg_color: 0x111128
                  border_opa: transp
                  shadow_opa: transp
                  radius: 8
                  on_click:
                    - lvgl.page.show: control_page
                  widgets:
                    - label:
                        text: "\U000F0335"
                        align: CENTER
                        text_font: font_icons
                        text_color: 0x6677cc

              # Settings — top right, long press only
              - button:
                  id: btn_to_settings
                  x: 438
                  y: 0
                  width: 42
                  height: 42
                  bg_opa: 0%
                  border_opa: transp
                  shadow_opa: transp
                  on_long_press:
                    - lvgl.page.show: settings_page
                  widgets:
                    - label:
                        text: "\U000F0533"
                        align: CENTER
                        text_font: font_icons
                        text_color: 0x222244

              # ── FACE TAP ZONE ───────────────────────────
              - button:
                  id: zone_center
                  x: 120
                  y: 130
                  width: 240
                  height: 230
                  bg_opa: transp
                  border_opa: transp
                  shadow_opa: transp
                  on_click:
                    - script.execute: face_happy_burst

    ############################################################
    # PAGE 2 — INFO
    ############################################################
    - id: info_page
      bg_color: 0x080818
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x080818
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  id: info_time_label
                  x: 0
                  y: 50
                  width: 480
                  text: "--:--"
                  text_font: font_large
                  text_color: 0x88aaff
                  text_align: CENTER
                  bg_opa: transp

              - label:
                  id: info_date_label
                  x: 0
                  y: 130
                  width: 480
                  text: "---"
                  text_font: font_medium
                  text_color: 0x445588
                  text_align: CENTER
                  bg_opa: transp

              - obj:
                  x: 40
                  y: 186
                  width: 400
                  height: 2
                  bg_color: 0x1a1a3a
                  border_width: 0

              - label:
                  x: 40
                  y: 210
                  width: 36
                  text: "\U000F059D"
                  text_font: font_icons
                  text_color: 0xffaa44
                  bg_opa: transp

              - label:
                  id: info_weather_label
                  x: 86
                  y: 210
                  width: 190
                  text: "---"
                  text_font: font_medium
                  text_color: 0xaaaaff
                  bg_opa: transp

              - label:
                  id: info_temp_label
                  x: 300
                  y: 210
                  width: 140
                  text: "--.- C"
                  text_font: font_medium
                  text_color: 0xff9944
                  bg_opa: transp

              - obj:
                  x: 40
                  y: 260
                  width: 400
                  height: 2
                  bg_color: 0x1a1a3a
                  border_width: 0

              - button:
                  x: 160
                  y: 410
                  width: 160
                  height: 50
                  bg_color: 0x111128
                  border_opa: transp
                  shadow_opa: transp
                  radius: 10
                  on_click:
                    - lvgl.page.show: face_page
                  widgets:
                    - label:
                        text: "< Back"
                        align: CENTER
                        text_font: font_small
                        text_color: 0x8888ff

    ############################################################
    # PAGE 3 — CONTROLS
    ############################################################
    - id: control_page
      bg_color: 0x080818
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x080818
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  x: 0
                  y: 16
                  width: 480
                  text: "Controls"
                  text_font: font_medium
                  text_color: 0x8888ff
                  text_align: CENTER
                  bg_opa: transp

              # Row 1 — Lights
              - button:
                  id: btn_light_1
                  x: 20
                  y: 68
                  width: 130
                  height: 95
                  bg_color: 0x141e38
                  border_color: 0x2244aa
                  border_width: 2
                  radius: 14
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.desk_light    # ← CHANGE ME
                  widgets:
                    - label:
                        text: "\U000F0335"
                        align: TOP_MID
                        y: 10
                        text_font: font_icons
                        text_color: 0xffdd88
                    - label:
                        text: "Desk"
                        align: BOTTOM_MID
                        y: -8
                        text_font: font_small
                        text_color: 0xccccff

              - button:
                  id: btn_light_2
                  x: 175
                  y: 68
                  width: 130
                  height: 95
                  bg_color: 0x141e38
                  border_color: 0x2244aa
                  border_width: 2
                  radius: 14
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.living_room   # ← CHANGE ME
                  widgets:
                    - label:
                        text: "\U000F0335"
                        align: TOP_MID
                        y: 10
                        text_font: font_icons
                        text_color: 0xffdd88
                    - label:
                        text: "Living"
                        align: BOTTOM_MID
                        y: -8
                        text_font: font_small
                        text_color: 0xccccff

              - button:
                  id: btn_light_3
                  x: 330
                  y: 68
                  width: 130
                  height: 95
                  bg_color: 0x141e38
                  border_color: 0x2244aa
                  border_width: 2
                  radius: 14
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.bedroom       # ← CHANGE ME
                  widgets:
                    - label:
                        text: "\U000F0335"
                        align: TOP_MID
                        y: 10
                        text_font: font_icons
                        text_color: 0xffdd88
                    - label:
                        text: "Bedroom"
                        align: BOTTOM_MID
                        y: -8
                        text_font: font_small
                        text_color: 0xccccff

              # Row 2 — Scenes
              - button:
                  id: btn_scene_1
                  x: 20
                  y: 185
                  width: 130
                  height: 95
                  bg_color: 0x142214
                  border_color: 0x228844
                  border_width: 2
                  radius: 14
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: scene.turn_on
                        data:
                          entity_id: scene.morning       # ← CHANGE ME
                  widgets:
                    - label:
                        text: "\U000F059D"
                        align: TOP_MID
                        y: 10
                        text_font: font_icons
                        text_color: 0xffcc44
                    - label:
                        text: "Morning"
                        align: BOTTOM_MID
                        y: -8
                        text_font: font_small
                        text_color: 0xccffcc

              - button:
                  id: btn_scene_2
                  x: 175
                  y: 185
                  width: 130
                  height: 95
                  bg_color: 0x142214
                  border_color: 0x228844
                  border_width: 2
                  radius: 14
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: scene.turn_on
                        data:
                          entity_id: scene.evening       # ← CHANGE ME
                  widgets:
                    - label:
                        text: "\U000F0594"
                        align: TOP_MID
                        y: 10
                        text_font: font_icons
                        text_color: 0x8899ff
                    - label:
                        text: "Evening"
                        align: BOTTOM_MID
                        y: -8
                        text_font: font_small
                        text_color: 0xccffcc

              - button:
                  id: btn_scene_3
                  x: 330
                  y: 185
                  width: 130
                  height: 95
                  bg_color: 0x221414
                  border_color: 0x882222
                  border_width: 2
                  radius: 14
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: scene.turn_on
                        data:
                          entity_id: scene.movie         # ← CHANGE ME
                  widgets:
                    - label:
                        text: "\U000F0438"
                        align: TOP_MID
                        y: 10
                        text_font: font_icons
                        text_color: 0xff8888
                    - label:
                        text: "Movie"
                        align: BOTTOM_MID
                        y: -8
                        text_font: font_small
                        text_color: 0xffcccc

              # All off
              - button:
                  x: 140
                  y: 305
                  width: 200
                  height: 60
                  bg_color: 0x1e1010
                  border_color: 0x772222
                  border_width: 2
                  radius: 14
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: light.turn_off
                        data:
                          entity_id: all
                  widgets:
                    - label:
                        text: "\U000F0493  All Off"
                        align: CENTER
                        text_font: font_icons
                        text_color: 0xff6666

              # Back
              - button:
                  x: 160
                  y: 410
                  width: 160
                  height: 50
                  bg_color: 0x111128
                  border_opa: transp
                  shadow_opa: transp
                  radius: 10
                  on_click:
                    - lvgl.page.show: face_page
                  widgets:
                    - label:
                        text: "< Back"
                        align: CENTER
                        text_font: font_small
                        text_color: 0x8888ff

    ############################################################
    # PAGE 4 — SETTINGS
    ############################################################
    - id: settings_page
      bg_color: 0x080808
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x080808
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  x: 0
                  y: 16
                  width: 480
                  text: "Settings"
                  text_font: font_medium
                  text_color: 0xaaaaff
                  text_align: CENTER
                  bg_opa: transp

              # Status
              - label:
                  id: settings_wifi_label
                  x: 40
                  y: 68
                  width: 400
                  text: "WiFi: --"
                  text_font: font_small
                  text_color: 0x44ffaa
                  bg_opa: transp

              - label:
                  id: settings_ha_label
                  x: 40
                  y: 98
                  width: 400
                  text: "HA: --"
                  text_font: font_small
                  text_color: 0x44ffaa
                  bg_opa: transp

              # Brightness
              - label:
                  x: 40
                  y: 140
                  width: 200
                  text: "Brightness"
                  text_font: font_small
                  text_color: 0x888888
                  bg_opa: transp

              - slider:
                  id: brightness_slider
                  x: 40
                  y: 168
                  width: 400
                  height: 28
                  min_value: 10
                  max_value: 100
                  value: 100
                  on_value:
                    then:
                      - light.turn_on:
                          id: display_backlight
                          brightness: !lambda "return x / 100.0f;"

              # Face style
              - label:
                  x: 40
                  y: 218
                  width: 200
                  text: "Face Style"
                  text_font: font_small
                  text_color: 0x888888
                  bg_opa: transp

              - button:
                  x: 20
                  y: 248
                  width: 130
                  height: 58
                  bg_color: 0x1e0e2a
                  border_color: 0x884499
                  border_width: 2
                  radius: 12
                  shadow_opa: transp
                  on_click:
                    - script.execute: face_set_female
                    - lvgl.page.show: face_page
                  widgets:
                    - label:
                        text: "\U000F0156  F"
                        align: CENTER
                        text_font: font_icons
                        text_color: 0xdd88ff

              - button:
                  x: 175
                  y: 248
                  width: 130
                  height: 58
                  bg_color: 0x0e1a2a
                  border_color: 0x336699
                  border_width: 2
                  radius: 12
                  shadow_opa: transp
                  on_click:
                    - script.execute: face_set_male
                    - lvgl.page.show: face_page
                  widgets:
                    - label:
                        text: "\U000F0157  M"
                        align: CENTER
                        text_font: font_icons
                        text_color: 0x88bbff

              - button:
                  x: 330
                  y: 248
                  width: 130
                  height: 58
                  bg_color: 0x0e2a1a
                  border_color: 0x338855
                  border_width: 2
                  radius: 12
                  shadow_opa: transp
                  on_click:
                    - script.execute: face_set_robot
                    - lvgl.page.show: face_page
                  widgets:
                    - label:
                        text: "\U000F066F"
                        align: CENTER
                        text_font: font_icons
                        text_color: 0x88ffbb

              # Restart
              - button:
                  x: 20
                  y: 338
                  width: 150
                  height: 55
                  bg_color: 0x1e0a0a
                  border_color: 0x882222
                  border_width: 2
                  radius: 12
                  shadow_opa: transp
                  on_click:
                    - button.press: restart_button
                  widgets:
                    - label:
                        text: "Restart"
                        align: CENTER
                        text_font: font_small
                        text_color: 0xff6666

              # Back
              - button:
                  x: 290
                  y: 410
                  width: 170
                  height: 50
                  bg_color: 0x111128
                  border_opa: transp
                  shadow_opa: transp
                  radius: 10
                  on_click:
                    - lvgl.page.show: face_page
                  widgets:
                    - label:
                        text: "< Back"
                        align: CENTER
                        text_font: font_small
                        text_color: 0x8888ff

              # BL Test button
              - button:
                  x: 20
                  y: 410
                  width: 250
                  height: 50
                  bg_color: 0x1a2a1a
                  border_color: 0x338833
                  border_width: 2
                  radius: 12
                  shadow_opa: transp
                  on_click:
                    - script.execute: backlight_freq_test
                  widgets:
                    - label:
                        id: bl_test_label
                        text: "BL Freq Test"
                        align: CENTER
                        text_font: font_small
                        text_color: 0x88ff88

##############################################################
# RESTART BUTTON
##############################################################

